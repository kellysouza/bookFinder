name: deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: bookfinder
          region: us-east1
          source: .
          flags: --allow-unauthenticated --max-instances=2 --set-secrets=DATABASE_URL=DATABASE_URL:latest,LLM_API_TOKEN=LLM_API_TOKEN:latest,LLM_API_GATEWAY=LLM_API_GATEWAY:latest
