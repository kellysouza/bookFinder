<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Book finder</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        background: #f4f5f8;
        color: #111;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      button,
      input {
        font: inherit;
      }
      .phone {
        background: #fff;
        border-left: 1px solid #d0d4dc;
        border-right: 1px solid #d0d4dc;
        display: flex;
        flex-direction: column;
        margin: 0 auto;
        max-width: 40rem;
        min-height: 100vh;
      }
      .titlebar {
        align-items: center;
        border-bottom: 1px solid #e5e7eb;
        display: flex;
        justify-content: space-between;
        padding: 10px 16px;
      }
      .titlebar h1 {
        font-size: 17px;
        margin: 0;
      }
      .newsearch {
        align-items: center;
        background: #fff;
        border: 1px solid #d0d4dc;
        border-radius: 8px;
        color: #333;
        cursor: pointer;
        display: flex;
        font-size: 14px;
        font-weight: 500;
        gap: 6px;
        padding: 4px 10px;
      }
      .newsearch b {
        font-size: 18px;
        line-height: 1;
      }
      .thread {
        display: flex;
        flex: 1 0 16rem;
        flex-direction: column;
        gap: 9px;
        padding: 14px;
      }
      .bubble {
        border-radius: 14px;
        font-size: 14px;
        line-height: 1.4;
        max-width: 82%;
        padding: 9px 13px;
        white-space: pre-wrap;
      }
      .member {
        align-self: flex-end;
        background: #2f6fde;
        border-bottom-right-radius: 4px;
        color: #fff;
      }
      .finder {
        align-self: flex-start;
        background: #eef0f4;
        border-bottom-left-radius: 4px;
        color: #111;
      }
      .finder.model {
        background: #e6dcff;
      }
      .choices {
        align-self: flex-start;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .choice {
        background: #fff;
        border: 1px solid #2f6fde;
        border-radius: 999px;
        color: #2f6fde;
        cursor: pointer;
        font-size: 13px;
        padding: 5px 12px;
      }
      .choice:disabled {
        cursor: default;
      }
      .choice.picked {
        background: #2f6fde;
        color: #fff;
      }
      .choice.faded {
        opacity: 0.35;
      }
      .likely {
        background: #faf8ff;
        border-top: 1px solid #e5e7eb;
        max-height: 45%;
        overflow-y: auto;
        padding: 10px 14px;
      }
      .likely h2 {
        color: #6a55b8;
        font-size: 12px;
        letter-spacing: 0.05em;
        margin: 0 0 6px;
        text-transform: uppercase;
      }
      .cards {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .card {
        background: #fff;
        border: 1px solid #c9b8f5;
        border-left: 4px solid #8a6ae0;
        border-radius: 9px;
        padding: 7px 11px;
        transition: box-shadow 0.4s;
      }
      .card.new {
        box-shadow: 0 0 0 2px #ffd36b;
      }
      .cardtitle {
        font-size: 14px;
        font-style: italic;
        font-weight: 700;
      }
      .cardauthor {
        color: #555;
        font-size: 12px;
        margin: 1px 0 2px;
      }
      .cardreason,
      .cardsource {
        font-size: 12px;
        line-height: 1.3;
      }
      .cardsource {
        color: #3d4a3a;
        margin-top: 4px;
      }
      .use {
        background: #fff;
        border: 1px solid #2f6fde;
        border-radius: 999px;
        color: #2f6fde;
        cursor: pointer;
        font-size: 12px;
        margin-top: 6px;
        padding: 4px 10px;
      }
      .form label {
        display: block;
        font-size: 12px;
        margin: 6px 0;
      }
      .form input,
      .form textarea {
        display: block;
        font: inherit;
        margin-top: 2px;
        width: 100%;
      }
      .error {
        color: #8a1f1f;
        font-size: 13px;
        min-height: 1em;
      }
      .bar {
        align-items: center;
        border-top: 1px solid #e5e7eb;
        display: flex;
        gap: 8px;
        padding: 10px 12px;
      }
      .bar input {
        border: 1px solid #d0d4dc;
        border-radius: 999px;
        flex: 1;
        font-size: 14px;
        padding: 7px 13px;
      }
      .bar button {
        background: #2f6fde;
        border: none;
        border-radius: 999px;
        color: #fff;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        padding: 7px 15px;
      }
      .bar input:disabled,
      .bar button:disabled {
        cursor: default;
        opacity: 0.35;
      }
    </style>
  </head>
  <body>
    <div class="phone">
      <header class="titlebar">
        <h1>Book finder</h1>
        <button id="new-search" class="newsearch" type="button"><b>+</b> New search</button>
      </header>

      <main id="thread" class="thread" aria-live="polite"></main>

      <section id="likely" class="likely" hidden>
        <h2>Likely books</h2>
        <div id="cards" class="cards"></div>
      </section>

      <section id="form-section" class="likely" hidden>
        <h2>Nomination</h2>
        <form id="nomination" class="form">
          <label>Title <input id="nomination-title" name="title" readonly /></label>
          <label>Author <input id="nomination-author" name="author" readonly /></label>
          <label>Pages <input id="nomination-pages" name="page_count" readonly /></label>
          <label>Summary <textarea id="nomination-summary" name="member_description"></textarea></label>
          <p id="nomination-source" class="cardsource"></p>
          <p id="nomination-error" class="error" role="alert"></p>
          <button type="submit">Save</button>
        </form>
      </section>

      <section id="saved" class="likely">
        <h2>Nominations</h2>
        <div id="saved-list" class="cards"></div>
      </section>

      <section id="search-section" class="likely">
        <h2>Search by meaning</h2>
        <form id="meaning" class="form">
          <label>A kind of book <input id="meaning-query" name="query" aria-label="A kind of book" /></label>
          <button type="submit">Search</button>
        </form>
        <div id="meaning-results" class="cards"></div>
      </section>

      <form id="bar" class="bar">
        <input
          id="text"
          type="text"
          maxlength="500"
          autocomplete="off"
          aria-label="Your message"
          placeholder="Choose an option above"
          disabled
        />
        <button id="send" type="submit" disabled>Send</button>
      </form>
    </div>

    <template id="opening">
      <div class="bubble finder">Hi, I'm here to help you nominate a book. Do you have one in mind, or would you like help coming up with one?</div>
      <div class="choices">
        <button class="choice" type="button" data-path="find">I have one in mind</button>
        <button class="choice" type="button" data-path="suggest">I need help coming up with one</button>
      </div>
    </template>

    <script>
      const FOLLOW_UPS = {
        find: "Great, I'd love to help you find it. Tell me any details you can recall.",
        suggest: "Great, I'll make suggestions. Tell me what kinds of books you like.",
      };
      const ERROR_LINE = "Sorry, I couldn't reach the book finder just now. Please try again.";
      const LIMIT_LINE = "This chat is getting long. Tap New search to start fresh.";
      const MEMBER_LINE_LIMIT = 30;
      const HIGHLIGHT_MS = 2000;

      const thread = document.querySelector("#thread");
      const likely = document.querySelector("#likely");
      const cards = document.querySelector("#cards");
      const bar = document.querySelector("#bar");
      const textBox = document.querySelector("#text");
      const sendButton = document.querySelector("#send");
      const opening = document.querySelector("#opening");

      // A response that arrives after New search belongs to the old search; `search` tells them apart.
      const state = {
        path: null,
        turns: [],
        books: [],
        waiting: false,
        search: 0,
        sessionId: null,
        selected: null,
      };

      function memberLineCount() {
        return state.turns.filter((turn) => turn.speaker === "member").length;
      }

      function atLimit() {
        return memberLineCount() >= MEMBER_LINE_LIMIT;
      }

      function updateBar() {
        const open = state.path !== null && !atLimit();
        textBox.disabled = !open;
        sendButton.disabled = !open || state.waiting;
        textBox.placeholder = state.path === null ? "Choose an option above" : "Tell me more";
      }

      function addBubble(text, classes) {
        const bubble = document.createElement("div");
        bubble.className = `bubble ${classes}`;
        bubble.textContent = text;
        thread.append(bubble);
        scrollToEnd();
      }

      function scrollToEnd() {
        thread.scrollTop = thread.scrollHeight;
      }

      function bookKey(book) {
        return `${book.title.trim().toLowerCase()}\n${book.author.trim().toLowerCase()}`;
      }

      function makeCard(book) {
        const card = document.createElement("div");
        card.className = "card";
        const title = document.createElement("div");
        title.className = "cardtitle";
        title.textContent = book.title;
        const author = document.createElement("div");
        author.className = "cardauthor";
        author.textContent = book.year === null ? book.author : `${book.author} · ${book.year}`;
        const reason = document.createElement("div");
        reason.className = "cardreason";
        reason.textContent = book.reason;
        const source = document.createElement("div");
        source.className = "cardsource";
        source.textContent = book.source_label || "Open Library";
        if (book.open_library_description) {
          source.textContent += " " + book.open_library_description;
        }
        const use = document.createElement("button");
        use.type = "button";
        use.className = "use";
        use.textContent = "Use this book";
        use.addEventListener("click", () => selectBook(book));
        card.append(title, author, reason, source, use);
        return card;
      }

      function selectBook(book) {
        state.selected = book;
        document.querySelector("#form-section").hidden = false;
        document.querySelector("#nomination-title").value = book.title;
        document.querySelector("#nomination-author").value = book.author;
        document.querySelector("#nomination-pages").value = book.page_count ?? "";
        document.querySelector("#nomination-summary").value = book.summary || "";
        document.querySelector("#nomination-source").textContent = book.source_label || "";
        document.querySelector("#nomination-error").textContent = "";
      }

      function showBooks(books) {
        const previous = new Set(state.books.map(bookKey));
        state.books = books;
        cards.replaceChildren();
        for (const book of books) {
          const card = makeCard(book);
          if (!previous.has(bookKey(book))) {
            card.classList.add("new");
            setTimeout(() => card.classList.remove("new"), HIGHLIGHT_MS);
          }
          cards.append(card);
        }
        likely.hidden = books.length === 0;
        scrollToEnd();
      }

      function choose(button, choices) {
        state.path = button.dataset.path;
        for (const choice of choices.querySelectorAll(".choice")) {
          choice.disabled = true;
          choice.classList.add(choice === button ? "picked" : "faded");
        }
        addBubble(FOLLOW_UPS[state.path], "finder");
        updateBar();
        textBox.focus();
      }

      function startSearch() {
        state.path = null;
        state.turns = [];
        state.waiting = false;
        state.sessionId = null;
        state.selected = null;
        state.search += 1;
        document.querySelector("#form-section").hidden = true;
        showBooks([]);
        textBox.value = "";
        thread.replaceChildren(opening.content.cloneNode(true));
        const choices = thread.querySelector(".choices");
        for (const button of choices.querySelectorAll(".choice")) {
          button.addEventListener("click", () => choose(button, choices));
        }
        updateBar();
      }

      async function inquire() {
        const response = await fetch("/inquire", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            path: state.path,
            turns: state.turns,
            books: state.books.map((book) => ({
              title: book.title,
              author: book.author,
              year: book.year,
              reason: book.reason,
            })),
            session_id: state.sessionId,
          }),
        });
        if (!response.ok) {
          throw new Error(`The book finder answered ${response.status}.`);
        }
        return response.json();
      }

      async function send() {
        const text = textBox.value.trim();
        if (text === "" || state.waiting || textBox.disabled) {
          return;
        }
        const search = state.search;
        addBubble(text, "member");
        state.turns.push({ speaker: "member", text });
        textBox.value = "";
        state.waiting = true;
        updateBar();
        try {
          const answer = await inquire();
          if (search !== state.search) {
            return;
          }
          addBubble(answer.reply, "finder model");
          state.turns.push({ speaker: "finder", text: answer.reply });
          state.sessionId = answer.session_id;
          showBooks(answer.books);
        } catch {
          if (search !== state.search) {
            return;
          }
          addBubble(ERROR_LINE, "finder");
        }
        state.waiting = false;
        if (atLimit()) {
          addBubble(LIMIT_LINE, "finder");
        }
        updateBar();
        if (!textBox.disabled) {
          textBox.focus();
        }
      }

      bar.addEventListener("submit", (event) => {
        event.preventDefault();
        send();
      });
      async function loadNominations() {
        const response = await fetch("/nominations");
        if (!response.ok) {
          return;
        }
        const saved = await response.json();
        const list = document.querySelector("#saved-list");
        list.replaceChildren();
        for (const book of saved) {
          const card = document.createElement("div");
          card.className = "card";
          card.textContent = `${book.title} — ${book.author}. ${book.member_description}`;
          list.append(card);
        }
      }

      document.querySelector("#nomination").addEventListener("submit", async (event) => {
        event.preventDefault();
        const error = document.querySelector("#nomination-error");
        error.textContent = "";
        const selected = state.selected;
        if (!selected) {
          return;
        }
        const response = await fetch("/nominations", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            session_id: state.sessionId,
            title: document.querySelector("#nomination-title").value,
            author: document.querySelector("#nomination-author").value,
            page_count: selected.page_count,
            isbn: selected.isbn || null,
            open_library_description: selected.open_library_description || null,
            member_description: document.querySelector("#nomination-summary").value,
          }),
        });
        if (!response.ok) {
          const payload = await response.json();
          error.textContent = payload.detail || "The book was not added.";
          return;
        }
        await loadNominations();
      });

      document.querySelector("#meaning").addEventListener("submit", async (event) => {
        event.preventDefault();
        const response = await fetch("/similar", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query: document.querySelector("#meaning-query").value }),
        });
        const results = document.querySelector("#meaning-results");
        results.replaceChildren();
        if (!response.ok) {
          results.textContent = "Search is unavailable right now.";
          return;
        }
        const hits = await response.json();
        if (hits.length === 0) {
          results.textContent = "No saved description matched that.";
          return;
        }
        for (const hit of hits) {
          const card = document.createElement("div");
          card.className = "card";
          const where = hit.title ? `${hit.title}. ` : "";
          card.textContent = `${where}${hit.source}. ${hit.body}`;
          results.append(card);
        }
      });

      document.querySelector("#new-search").addEventListener("click", startSearch);

      startSearch();
      loadNominations();
    </script>
  </body>
</html>
